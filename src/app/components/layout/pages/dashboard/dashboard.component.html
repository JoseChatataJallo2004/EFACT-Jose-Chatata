<div class="center-container">
  <button mat-raised-button color="pdf" (click)="verPdf()">Descargar PDF</button>
  <button mat-raised-button color="xml" (click)="verXml()">Descargar XML</button>
  <button mat-raised-button color="cdr" (click)="verCdr()">Descargar CDR</button>
</div>

<iframe
  *ngIf="iframeUrl"

  width="100%"
  height="600px">
</iframe>
